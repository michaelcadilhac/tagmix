services:
  tagmix:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TAGMIX_DATA_DIR: /data
      TAGMIX_ACCOUNT_DIR: /accounts
      TAGMIX_APP_ORIGIN: ${TAGMIX_APP_ORIGIN:-}
      TAGMIX_CATALOG_TTL_MS: 86400000
    volumes:
      - tagmix-data:/data
      - tagmix-accounts:/accounts
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tagmix-data:
  tagmix-accounts:
