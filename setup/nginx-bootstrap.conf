# Temporary HTTP-only site for obtaining the first TLS certificate.
# Replace tagmix.example.com, then replace this site with nginx.conf after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name tagmix.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
