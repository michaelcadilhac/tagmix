# Install inside nginx's http context, e.g. /etc/nginx/sites-available/tagmix.
# Replace tagmix.example.com everywhere, including the certificate paths.
# Obtain the certificate before enabling this file; see setup/README.md.

server {
    listen 80;
    listen [::]:80;
    server_name tagmix.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://tagmix.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tagmix.example.com;

    ssl_certificate /etc/letsencrypt/live/tagmix.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tagmix.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TagMixTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # First requests may fetch and convert scores or all four audio tracks.
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Stream Next.js responses; preserve upstream Cache-Control and ranges.
        proxy_buffering off;
        proxy_cache off;
    }
}
